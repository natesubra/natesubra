name: wordcloud

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/wordcloud.yml"

permissions:
  contents: write

concurrency:
  group: wordcloud
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-jetbrains-mono

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate wordcloud
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/gen_wordcloud.py --user "${{ github.repository_owner }}" --seed 42

      - name: Commit if changed
        run: |
          if git diff --quiet -- wordcloud.svg; then
            echo "wordcloud.svg unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wordcloud.svg
          git commit -m "Update wordcloud"
          git push
